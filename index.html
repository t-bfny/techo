<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16171a">
  <title>techo</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body data-view="home">
  <div id="app">
    <nav id="sidebar">
      <div class="side-top">
        <button id="newBtn" class="primary">新規ノート</button>
      </div>
      <div class="side-scroll">
        <button class="side-item" data-go="home"><span>ホーム画面</span></button>
        <button class="side-head link" data-filter="shortcuts"><span>ショートカット</span></button>
        <div id="shortcutList"></div>
        <div class="side-head"><span>最近のノート</span></div>
        <div id="recentList"></div>
        <button class="side-item sep-top" data-filter="all"><span>ノート</span><span class="n" id="countAll"></span></button>
        <button class="side-item" data-go="tasks"><span>タスク</span><span class="n" id="countTasks"></span></button>
        <button class="side-item" data-go="files"><span>ファイル</span><span class="n" id="countFiles"></span></button>
        <div class="side-head">
          <button class="link-plain" data-go="notebooks">ノートブック</button>
          <button id="addNotebookBtn" class="mini" title="ノートブックを追加">+</button>
        </div>
        <div id="notebookList"></div>
      </div>
      <div class="side-import">
        <button id="enexBtn">Evernoteから取り込み</button>
        <input id="enexInput" type="file" accept=".enex" multiple hidden>
      </div>
      <footer class="bar small">
        <button id="exportBtn">書き出し</button>
        <button id="importBtn">読み込み</button>
        <input id="importInput" type="file" accept="application/json" hidden>
      </footer>
    </nav>
    <div id="scrim" hidden></div>

    <aside id="listPane">
      <header class="bar">
        <button id="menuBtn" class="drawer-only">メニュー</button>
        <strong id="filterName" class="ellipsis"></strong>
        <span id="count" class="dim"></span>
        <span class="grow"></span>
        <span id="notebookTools" hidden>
          <button id="pinNotebookBtn" class="mini">ショートカット</button>
          <button id="renameNotebookBtn" class="mini">名前変更</button>
          <button id="deleteNotebookBtn" class="mini danger">削除</button>
        </span>
      </header>
      <div class="search-row">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
      </div>
      <ul id="noteList"></ul>
    </aside>

    <section id="homeView" class="page">
      <header class="bar">
        <button class="drawer-only" data-drawer>メニュー</button>
        <strong id="homeDate"></strong>
        <span class="grow"></span>
        <button class="primary" data-new>新規ノート</button>
      </header>
      <div class="page-body">
        <h2 class="page-h"><button class="link-plain" data-filter="all">最近のノート</button></h2>
        <div id="homeRecent" class="cards"></div>
        <div id="homeTasksWrap">
          <h2 class="page-h"><button class="link-plain" data-go="tasks">今日までのタスク</button></h2>
          <div id="homeTasks" class="rows"></div>
        </div>
        <div class="home-cols">
          <div>
            <h2 class="page-h"><button class="link-plain" data-filter="shortcuts">ショートカット</button></h2>
            <div id="homeShortcuts" class="rows"></div>
          </div>
          <div>
            <h2 class="page-h"><button class="link-plain" data-go="notebooks">ノートブック</button></h2>
            <div id="homeNotebooks" class="rows"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="notebooksView" class="page">
      <header class="bar">
        <button class="drawer-only" data-drawer>メニュー</button>
        <strong>ノートブック</strong>
        <span id="notebookCount" class="dim"></span>
        <span class="grow"></span>
        <button id="newNotebookBtn">新規ノートブック</button>
      </header>
      <div class="page-body">
        <div class="nb-table">
          <div class="nb-head"><span>名前</span><span>ノート</span><span>更新</span></div>
          <div id="nbRows"></div>
        </div>
      </div>
    </section>

    <section id="tasksView" class="page">
      <header class="bar">
        <button class="drawer-only" data-drawer>メニュー</button>
        <strong>タスク</strong>
        <span id="taskCount" class="dim"></span>
        <span class="grow"></span>
        <span class="seg">
          <button data-taskmode="open" class="on">未完了</button>
          <button data-taskmode="done">完了</button>
        </span>
      </header>
      <div class="page-body"><div id="taskGroups" class="task-page"></div></div>
    </section>

    <section id="filesView" class="page">
      <header class="bar">
        <button class="drawer-only" data-drawer>メニュー</button>
        <strong>ファイル</strong>
        <span id="fileCount" class="dim"></span>
        <span class="grow"></span>
        <span class="seg">
          <button data-filemode="all" class="on">すべて</button>
          <button data-filemode="image">画像</button>
          <button data-filemode="other">PDF・その他</button>
        </span>
      </header>
      <div class="page-body"><div id="fileGrid" class="file-grid"></div></div>
    </section>

    <main id="editorPane">
      <div id="tabs"><div id="tabList"></div><button id="newTabBtn" class="tab-add" title="新しいノートをタブで開く">+</button></div>
      <p id="emptyState">メモを選ぶか、新規で作成</p>
      <div id="editorWrap" hidden>
        <header class="bar crumbs">
          <button id="backBtn" class="narrow-only">一覧</button>
          <select id="nbSelect" title="ノートブックを移動"></select>
          <span class="sep">›</span>
          <span id="crumbTitle" class="ellipsis"></span>
          <span class="grow"></span>
          <button id="pinBtn" class="wide-only">ショートカット</button>
          <button id="stageBtn">本番</button>
          <button id="deleteBtn" class="danger wide-only">削除</button>
          <button id="moreBtn" class="narrow-only" data-pop="more">その他</button>
        </header>
        <div id="toolbar" class="bar">
          <button data-pop="insert" class="strong">挿入</button>
          <span class="vr"></span>
          <button data-cmd="undo" title="元に戻す">↶</button>
          <button data-cmd="redo" title="やり直し">↷</button>
          <span class="vr"></span>
          <select id="blockSelect" title="段落の種類">
            <option value="p">本文</option>
            <option value="1">見出し1</option>
            <option value="2">見出し2</option>
            <option value="3">見出し3</option>
          </select>
          <span class="vr"></span>
          <button data-cmd="bold" title="太字 (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
          <button data-cmd="underline" title="下線 (Ctrl+U)"><u>U</u></button>
          <button data-cmd="strike" title="取り消し線"><s>S</s></button>
          <button data-pop="color" title="文字色"><span class="swatch-a" id="colorMark">A</span></button>
          <button data-pop="highlight" title="ハイライト"><span class="swatch-h" id="hlMark">A</span></button>
          <span class="vr"></span>
          <button data-cmd="bulletList" title="箇条書き">• 箇条</button>
          <button data-cmd="orderedList" title="番号付き">1. 番号</button>
          <button data-cmd="taskList" title="チェックリスト">☐ チェック</button>
          <button id="dueBtn" data-pop="due" title="このタスクの期限" hidden>期限</button>
          <span id="tableTools" hidden>
            <span class="vr"></span>
            <button data-table="addRowAfter">行+</button>
            <button data-table="addColumnAfter">列+</button>
            <button data-table="deleteRow">行-</button>
            <button data-table="deleteColumn">列-</button>
          </span>
        </div>
        <div class="scroll" id="editorScroll">
          <input id="titleInput" placeholder="タイトル" autocomplete="off">
          <div id="editor"></div>
        </div>
      </div>
      <input id="imageInput" type="file" accept="image/*" multiple hidden>
      <input id="fileInput" type="file" multiple hidden>
    </main>
  </div>

  <div id="popover" hidden></div>

  <section id="stage" hidden>
    <header class="bar">
      <button id="stageExit">戻る</button>
      <span class="grow"></span>
      <button id="fontDown">A-</button>
      <button id="fontUp">A+</button>
    </header>
    <div class="scroll"><article id="stageBody"></article></div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
